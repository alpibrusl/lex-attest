name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lex
        run: |
          set -euo pipefail
          V=0.10.12; T=x86_64-unknown-linux-gnu
          curl -fsSL "https://github.com/alpibrusl/lex-lang/releases/download/v$V/lex-v$V-$T.tar.gz" -o /tmp/lex.tgz
          tar -xzf /tmp/lex.tgz -C /tmp
          echo "/tmp/lex-v$V-$T" >> "$GITHUB_PATH"
      - run: lex pkg install
      - name: Type-check
        run: |
          set -e
          for f in src/*.lex; do lex check "$f" >/dev/null || { echo "::error file=$f::lex check failed"; lex check "$f" | head -3; exit 1; }; done
      - run: lex fmt --check src/ tests/
      # `io` is the whole list, for the suite's own failure reporting.
      # src/auth.lex and src/codec.lex are effect-free by construction — that
      # is why they are separate from src/server.lex. If this needs to grow,
      # something testable has been folded back into a handler.
      - run: lex test --allow-effects io tests/

      # The sidecar's whole claim is that a caller in any language can use it
      # over HTTP. Asserting that in CI, with curl, is the only way to know it
      # is still true.
      - name: A caller with no Lex can chain and walk
        run: |
          set -euo pipefail
          ATTEST_KEY=ci-key DB_PATH=/tmp/ci.db PORT=8099 \
            lex run --allow-effects net,io,time,env,sql,fs_read,fs_write,concurrent,random,crypto,llm,proc,approval \
            src/server.lex main > /tmp/attest.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8099/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8099/health | grep -q '"ok":true'
          # Fail-closed: no token, no write.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8099/v1/events -d '{"kind":"x"}')" = 401
          A1=$(curl -sf -X POST localhost:8099/v1/events -H 'Authorization: Bearer ci-key' \
                 -d '{"kind":"meter.reading","payload":{"register_wh":105500}}' | jq -r .id)
          A2=$(curl -sf -X POST localhost:8099/v1/events -H 'Authorization: Bearer ci-key' \
                 -d "{\"kind\":\"settlement.energy\",\"parent\":\"$A1\",\"payload\":{\"eur_cents\":1064}}" | jq -r .id)
          test "$(curl -sf "localhost:8099/v1/events/$A2/chain" -H 'Authorization: Bearer ci-key' | jq 'length')" = 2
          curl -sf "localhost:8099/v1/events/$A2/chain" -H 'Authorization: Bearer ci-key' | jq -r '.[].kind' | grep -q meter.reading

      # The claim that makes this hostable by someone other than the party
      # relying on it: a customer who keeps an anchor can catch the HOST
      # tampering. Tamper with the database directly, behind the API, and
      # require the anchor to notice.
      - name: An anchor catches the host tampering
        run: |
          set -euo pipefail
          H='Authorization: Bearer ci-key'
          curl -sf -X POST localhost:8099/v1/events -H "$H" -d '{"kind":"a","payload":{"n":1}}' >/dev/null
          curl -sf -X POST localhost:8099/v1/events -H "$H" -d '{"kind":"b","payload":{"n":2}}' >/dev/null
          ANCHOR=$(curl -sf -X POST localhost:8099/v1/anchors -H "$H")
          test "$(curl -sf -X POST localhost:8099/v1/anchors/verify -H "$H" -d "$ANCHOR" | jq -r .reproduces)" = true
          # Delete a row straight out of the file the service is serving.
          python3 -c "import sqlite3;c=sqlite3.connect('/tmp/ci.db');c.execute(\"DELETE FROM events WHERE kind='b'\");c.commit()"
          test "$(curl -sf -X POST localhost:8099/v1/anchors/verify -H "$H" -d "$ANCHOR" | jq -r .reproduces)" = false

      # Publishing is the half that makes an anchor worth taking: one left in
      # the database it commits to proves nothing. A stand-in counterparty
      # records what it is sent, and the copy IT holds is then used to catch
      # the host.
      - name: A counterparty's copy of the anchor catches the host
        run: |
          set -euo pipefail
          H='Authorization: Bearer ci-key'
          python3 - <<'PYEOF' &
          import http.server
          class Hk(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  open('/tmp/received.json','wb').write(self.rfile.read(n))
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{}')
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', 8097), Hk).serve_forever()
          PYEOF
          sleep 2
          curl -sf -X POST localhost:8099/v1/events -H "$H" -d '{"kind":"c","payload":{"n":3}}' >/dev/null
          curl -sf -X POST localhost:8099/v1/anchors/publish -H "$H" \
            -d '{"kind":"webhook","url":"http://127.0.0.1:8097/anchors"}' | jq -e '.outcome.published == true' >/dev/null
          # The counterparty holds this, not us.
          test -s /tmp/received.json
          test "$(curl -sf -X POST localhost:8099/v1/anchors/verify -H "$H" -d @/tmp/received.json | jq -r .reproduces)" = true
          python3 -c "import sqlite3;c=sqlite3.connect('/tmp/ci.db');c.execute(\"DELETE FROM events WHERE kind='c'\");c.commit()"
          test "$(curl -sf -X POST localhost:8099/v1/anchors/verify -H "$H" -d @/tmp/received.json | jq -r .reproduces)" = false
          # A destination that cannot work is refused before anything is sent.
          curl -sf -X POST localhost:8099/v1/anchors/publish -H "$H" \
            -d '{"kind":"webhook","url":"not-a-url"}' | jq -e '.outcome.published == false' >/dev/null
